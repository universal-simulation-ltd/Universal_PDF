# Builds the desktop installers for all three platforms and attaches them to a
# GitHub Release. Pushing a `v*` tag is what publishes them; nothing here runs
# on an ordinary push to main.
#
# Replaced the Windows-only `build-windows.yml` (2026-08-24). The Windows job
# below is that workflow's job unchanged apart from the artifact name — see the
# `--publish never` and Supabase-secret comments, both of which were learned the
# hard way and still apply to all three platforms.
#
# Signing, macOS: signed and notarized WHEN THE SECRETS ARE SET, unsigned when
# they are not — decided at run time, because a matrix expression cannot read
# `secrets`. Set all five and the next tag ships a notarized DMG; leave them
# unset and nothing changes.
#
#   CSC_LINK                     the Developer ID .p12, base64-encoded
#   CSC_KEY_PASSWORD             its password
#   APPLE_ID                     the Apple ID that owns the team
#   APPLE_APP_SPECIFIC_PASSWORD  an app-specific password, NOT the account one
#   APPLE_TEAM_ID                ZH9C5TS86A
#
# ⚠️ WHY THIS IS NOT COSMETIC. macOS will not let a Gatekeeper-rejected app open
# a QUARANTINED file, and every PDF that came from a browser is quarantined. On
# an unsigned build the user gets "Apple could not verify «invoice.pdf» is free
# of malware" with a Move to Bin button — a dialog that accuses their own file
# and never names this app. Signing is what stops that, so an unsigned macOS
# release is a broken one, not merely a scary-looking one.
#
# Windows SmartScreen still warns on first run and Linux is unaffected; the
# download page explains both.

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and upload to"
        required: true

permissions:
  contents: write

jobs:
  create-release:
    name: Create the GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Idempotent: re-running the workflow against a tag that already has a
      # release must not fail. --verify-tag refuses to invent a release for a
      # tag that does not exist, which is the typo case worth catching.
      - name: Create the release if it does not exist
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — leaving it alone."
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop:
    name: ${{ matrix.name }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing shouldn't throw away the other two — a partial
      # release we can top up beats no release at all.
      fail-fast: false
      matrix:
        include:
          - name: Windows installer
            os: windows-latest
            script: dist:win
            artifacts: universal-pdf-windows
          # macOS runners are arm64, and electron-builder packages BOTH
          # architectures from one — see the `arch: [arm64, x64]` dmg target.
          # `script` is the FALLBACK here — the signing step below overrides it
          # when the certificate secrets are present.
          - name: macOS DMGs
            os: macos-14
            script: dist:mac:unsigned
            artifacts: universal-pdf-macos
          - name: Linux AppImage + deb
            os: ubuntu-latest
            script: dist:linux
            artifacts: universal-pdf-linux

    steps:
      - uses: actions/checkout@v5
        with:
          # workflow_dispatch runs against a branch by default; check out the
          # tag being released so the built version matches the release.
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      # Whether this run can sign is a property of the REPO's secrets, and
      # `strategy.matrix` is evaluated before secrets are available — so the
      # choice cannot live in the matrix and is made here instead.
      #
      # Both halves are checked: a certificate with no Apple ID signs but cannot
      # notarize, and electron-builder's notarize step then fails the whole
      # build rather than degrading. Better to ship the known-unsigned artefact
      # than to ship nothing.
      - name: Decide whether the macOS build can be signed
        id: signing
        if: matrix.os == 'macos-14'
        env:
          HAVE_CERT: ${{ secrets.CSC_LINK != '' }}
          HAVE_APPLE_ID: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        run: |
          if [ "$HAVE_CERT" = "true" ] && [ "$HAVE_APPLE_ID" = "true" ]; then
            echo "Signing credentials present — building a signed, notarized DMG."
            echo "script=dist:mac" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No macOS signing secrets — shipping an UNSIGNED build."
            echo "::warning::Gatekeeper will refuse to open quarantined PDFs with it."
            echo "script=dist:mac:unsigned" >> "$GITHUB_OUTPUT"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      # The Explorer thumbnail provider is native C++ and cannot be built by
      # electron-builder, so it is compiled first and staged into
      # native/win-thumbnail/dist, which package.json picks up as a Windows
      # extraResources entry. MSVC and CMake are both already on the runner.
      #
      # Deliberately NOT a hard failure: if this step breaks, the installer
      # should still ship — the app is unaffected, Explorer just falls back to
      # the flat icon it shows today. The warning is what surfaces it.
      - name: Build the Explorer thumbnail provider
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        shell: pwsh
        run: |
          try {
            ./native/win-thumbnail/scripts/build.ps1
          } catch {
            Write-Host "::warning::Thumbnail provider build failed - the installer will ship without Explorer thumbnails."
            Write-Host $_
            exit 1
          }

      # Register the freshly built DLL for this user and activate the preview
      # handler THROUGH THE SHELL'S SURROGATE, which is the only way to prove
      # the CLSID's AppID names the 64-bit prevhost.exe. Compiling proves
      # nothing about that one registry value: v0.6.4/v0.6.5 shipped naming the
      # 32-bit host, so 64-bit Explorer could never load the handler and the
      # pane stayed empty with no error anywhere.
      #
      # Also continue-on-error, for the same reason as the build above — a
      # broken preview pane must not hold back an otherwise good installer —
      # so the warning is again what surfaces it. Read the annotations.
      - name: Check the preview handler activates in the shell's host
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        shell: pwsh
        run: |
          $test = Get-ChildItem ./native/win-thumbnail -Recurse -Filter thumbtest.exe |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $test) {
            Write-Host "::warning::thumbtest.exe not found - skipping the shell-integration checks."
            exit 1
          }

          # A multi-page document, because the sealed-stream check below is
          # vacuous on a one-pager: PDFium reads a small file greedily while
          # parsing it, so only turning the page forces a genuinely new read.
          node -e "const {PDFDocument}=require('pdf-lib');(async()=>{const d=await PDFDocument.create();for(let i=0;i<8;i++){const p=d.addPage([595,842]);p.drawText('Page '+(i+1),{x:60,y:760,size:36});}require('fs').writeFileSync('multipage.pdf',await d.save());})()"

          & $test.FullName register
          try {
            & $test.FullName hosted
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::warning::The preview handler does not activate in the shell's surrogate - the installer will ship with a preview pane that never renders."
              exit 1
            }
            # The handler must never read the shell's stream after the opening
            # call returns. Against Explorer's marshalled proxy that read is an
            # outbound call into a process already blocked on us, which is the
            # hang Windows logs as AppHangXProcB1 (2026-08-27).
            & $test.FullName sealed multipage.pdf
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::warning::The preview handler reads the shell's stream lazily - this is the Explorer deadlock; the installer will ship with a preview pane that can hang Explorer."
              exit 1
            }
          } finally {
            & $test.FullName unregister
            Remove-Item multipage.pdf -ErrorAction SilentlyContinue
          }

      - name: Build installers
        # --publish never: electron-builder otherwise auto-publishes when it
        # sees a tag ref and fails on the missing GH_TOKEN, killing the job
        # before the steps below run. The "Attach to GitHub Release" step owns
        # publishing.
        # An empty step output is falsy in a GitHub expression, so the two
        # non-mac jobs (where the step above was skipped) fall through to the
        # matrix value untouched.
        # ⚠️ An absent secret arrives as an EMPTY environment variable, not an
        # absent one — and electron-builder reads a DEFINED CSC_LINK as "a
        # certificate was supplied". It resolves "" against the working
        # directory and dies with "<repo root> not a file", after announcing
        # that an empty password will be used. Unsetting the empties is what
        # keeps the unsigned path actually unsigned.
        shell: bash
        run: |
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || unset "$v"
          done
          npm run ${{ steps.signing.outputs.script || matrix.script }} -- --publish never
        env:
          # The platform Supabase URL + anon key are required to construct
          # the SDK's Supabase client at boot; without them the renderer
          # throws and the error boundary takes over (see PR #80). Both are
          # public (anon key is designed for client exposure), but we route
          # them via secrets to match how Cloudflare Pages injects them for
          # the web build rather than committing them.
          VITE_PLATFORM_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_PLATFORM_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # ⚠️ Must be 'true' when signing. CSC_IDENTITY_AUTO_DISCOVERY=false
          # disables electron-builder's signing path outright — with it set,
          # CSC_LINK is imported and then ignored, and the build comes out
          # unsigned while every log line says it is signing.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.signing.outputs.signed == 'true' && 'true' || 'false' }}
          # All five are empty on a repo with no secrets set, which is what puts
          # the step above on the unsigned path. Empty is not the same as
          # absent to electron-builder, but it never reads them on that path.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Proves the thing we are about to hand to strangers actually boots. A
      # packaged Electron app that dies on launch looks identical to a healthy
      # one until someone double-clicks it.
      #
      # ⚠️ Do NOT "simplify" this to `pgrep ... | head`: head exits 0 on empty
      # input, so the check passes whether or not the app is running.
      - name: Smoke-check the packaged app launches (macOS)
        if: matrix.os == 'macos-14'
        run: |
          APP="release/mac-arm64/Universal PDF.app/Contents/MacOS/Universal PDF"
          test -x "$APP"
          # ⚠️ env -u, not `ELECTRON_RUN_AS_NODE: ''`. Electron tests whether
          # the variable is PRESENT, not whether it is truthy, so setting it to
          # the empty string would still make the app run as plain Node and
          # exit 0 in under a second — looking dead when it is fine. It is set
          # inside Electron-hosted terminals (VS Code), which is exactly how
          # this check produced a false "crashed on boot" during development.
          env -u ELECTRON_RUN_AS_NODE "$APP" &
          APP_PID=$!
          sleep 15
          kill -0 "$APP_PID"
          kill "$APP_PID"

      # ⚠️ Proves the SIGNATURE, not merely that signing was attempted. A build
      # that silently came out unsigned is the failure this whole change exists
      # to prevent, and it looks exactly like a successful one in the log.
      # `spctl --assess` is the same question Gatekeeper asks when a user opens
      # a quarantined file, and `stapler validate` proves the notarization
      # ticket is attached rather than merely issued — an un-stapled app has to
      # reach Apple to launch, so it fails on an offline machine.
      - name: Verify the macOS build is signed and notarized
        if: matrix.os == 'macos-14' && steps.signing.outputs.signed == 'true'
        run: |
          APP="release/mac-arm64/Universal PDF.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose=4 "$APP" 2>&1 | tee /tmp/spctl.txt
          grep -q "source=Notarized Developer ID" /tmp/spctl.txt
          xcrun stapler validate "$APP"

      # ⚠️ electron-builder notarizes and staples the .app, then wraps it in a
      # DMG that carries NO ticket of its own — verified on a local signed build
      # on 2026-08-28, where `stapler validate` reported "does not have a ticket
      # stapled to it" for both DMGs while the app inside validated fine.
      #
      # It matters because the DMG is the thing people download. Un-stapled, the
      # first mount has to reach Apple to clear Gatekeeper, so a tester who is
      # offline — or behind a firewall that blocks the OCSP endpoint — gets a
      # scary dialog for an app that is in fact perfectly notarized. Submitting
      # the DMG is quick: its contents are already known-good to the notary.
      - name: Staple the notarization ticket to the DMGs
        if: matrix.os == 'macos-14' && steps.signing.outputs.signed == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for dmg in release/*.dmg; do
            echo "Notarizing $dmg"
            xcrun notarytool submit "$dmg" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifacts }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 30

      # ⚠️ shell: bash is REQUIRED — this step runs on Windows too, where the
      # default shell is PowerShell. There `$TAG` is not an environment
      # variable (that would be `$env:TAG`) and `release/Universal-PDF-*` is
      # not expanded for an external command, so the step silently became
      # `gh release upload "" ...` and failed with "release not found" while
      # macOS and Linux uploaded to the very same release. The workflow this
      # replaced used an action here, which never went near a shell.
      - name: Attach to GitHub Release
        shell: bash
        run: gh release upload "$TAG" release/Universal-PDF-* --clobber
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    name: Android APK + AAB
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      # ⚠️ Java 21, not "latest". Gradle rejects a newer class-file version
      # outright — Java 25 fails the build with "Unsupported class file major
      # version 69" before it compiles a line.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install deps
        run: npm ci

      # build:mobile is the `desktop` Vite mode: relative base, no service
      # worker. The default `npm run build` bakes in the /pdf/ base path used by
      # the hosted site, and every asset 404s inside the WebView.
      - name: Build web bundle and sync Capacitor
        run: npm run cap:sync
        env:
          VITE_PLATFORM_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_PLATFORM_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # Absent secrets produce an empty file, and build.gradle only wires the
      # signing config when ANDROID_KEYSTORE_PATH is set — so a fork without
      # the keystore still gets an unsigned build rather than a hard failure.
      # ⚠️ The secret goes through `env:`, NOT interpolated into the script.
      # `${{ secrets.X }}` inside `run:` is substituted into the shell source
      # before it executes, so it lands in the command line. And the emptiness
      # test has to happen in the shell rather than in a step-level `if:` —
      # the `secrets` context is not available to `if`.
      - name: Decode upload keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret set — building UNSIGNED."
            echo "An unsigned APK will not install on a phone and Play will reject it."
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "path=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"

      - name: Build release APK + AAB
        run: ./gradlew :app:assembleRelease :app:bundleRelease
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      # Gradle's own output names (app-release.apk) say nothing about which app
      # or which version, and every Capacitor project in the suite produces the
      # same three words. Rename to match the desktop artifacts.
      - name: Rename artifacts
        id: rename
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APK_DIR=android/app/build/outputs/apk/release
          # Gradle names it app-release-unsigned.apk when no signing config is
          # wired, and app-release.apk when one is — handle both so an unsigned
          # run fails at the upload (visibly) rather than here at `mv`.
          SRC=$(ls "$APK_DIR"/app-release*.apk | head -1)
          mv "$SRC" "$APK_DIR/Universal-PDF-$VERSION-android.apk"
          mv android/app/build/outputs/bundle/release/app-release.aab \
             "android/app/build/outputs/bundle/release/Universal-PDF-$VERSION-android.aab"

      # The AAB is NOT attached to the GitHub release. An .aab is not
      # installable — it is an upload format for Google Play, and offering it
      # next to the .apk only invites people to download the one that cannot be
      # opened. It stays a workflow artifact for whoever does the Play upload.
      - name: Upload AAB for the Play Console
        uses: actions/upload-artifact@v4
        with:
          name: universal-pdf-android-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to GitHub Release
        run: gh release upload "$TAG" android/app/build/outputs/apk/release/Universal-PDF-*.apk --clobber
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
