name: Build Windows installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build Windows installer
        # --publish never: electron-builder otherwise auto-publishes when it
        # sees a tag ref and fails on the missing GH_TOKEN, killing the job
        # before the steps below run. The "Attach installer to GitHub Release"
        # step owns publishing.
        run: npm run dist:win -- --publish never
        env:
          # The platform Supabase URL + anon key are required to construct
          # the SDK's Supabase client at boot; without them the renderer
          # throws and the error boundary takes over (see PR #80). Both are
          # public (anon key is designed for client exposure), but we route
          # them via secrets to match how Cloudflare Pages injects them for
          # the web build rather than committing them.
          VITE_PLATFORM_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_PLATFORM_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # No code-signing cert configured. CSC_IDENTITY_AUTO_DISCOVERY=false
          # stops electron-builder from probing the keychain on hosted runners.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: universal-pdf-windows-installer
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 30

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          generate_release_notes: true
