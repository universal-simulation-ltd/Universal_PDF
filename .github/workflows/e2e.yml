# The browser specs in `e2e/`, against the Vite dev server, on every push and
# pull request.
#
#   chromium        every spec that needs only the dev server
#   webkit, firefox the core flows (open → annotate → export, redact, sign,
#                   lock). WebKit is the iPhone app's engine, so these are the
#                   flows that must work there; Firefox costs one more job.
#
# What is left out, and why, is the SKIP list at the top of e2e/run-all.mjs —
# the Electron specs, the two that need a production or extension build, and
# the specs that are broken on main today. A spec that fails, then passes on
# its one retry, is reported as FLAKY and does not turn the run red.
#
# Playwright is not a dependency of the app (locally the specs borrow a
# sibling repo's copy), so it is installed here with --no-save at the version
# below, and its browsers are cached per version and engine.
#
# Free: the repo is public, so ubuntu-latest minutes cost nothing.

name: e2e

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PLAYWRIGHT_VERSION: '1.62.1'
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  E2E_BASE_URL: 'http://localhost:5174/'
  E2E_RESULTS: ${{ github.workspace }}/e2e-results

jobs:
  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            specs: ''
          - browser: webkit
            specs: '--core'
          - browser: firefox
            specs: '--core'
    env:
      E2E_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Playwright ${{ env.PLAYWRIGHT_VERSION }}
        run: npm install --no-save --no-audit --no-fund "playwright@$PLAYWRIGHT_VERSION"

      - name: Cache the ${{ matrix.browser }} build
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ env.PLAYWRIGHT_VERSION }}-${{ matrix.browser }}-${{ runner.os }}

      - name: Download ${{ matrix.browser }}
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install "$E2E_BROWSER"

      # System libraries are not in the cache (they live outside it), so they
      # are installed every time; it is an apt install, about half a minute.
      - name: System libraries for ${{ matrix.browser }}
        run: npx playwright install-deps "$E2E_BROWSER"

      # The app refuses to start without a Supabase URL and key. Placeholders
      # in the right shape let it start; nothing in these specs signs in, and
      # the auth calls simply fail offline, as they would on a plane. No
      # secret is needed, and CI never talks to the real project.
      - name: Placeholder build configuration
        run: |
          printf '%s\n' \
            'VITE_PLATFORM_SUPABASE_URL=https://ci-placeholder.supabase.co' \
            'VITE_PLATFORM_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiI.eyJyb2xlIjoiYW5vbiJ9.c2lnbmF0dXJl' \
            > .env.local

      - name: Start the dev server
        run: |
          nohup npx vite --port 5174 --strictPort > vite.log 2>&1 &
          for i in $(seq 60); do
            curl -sf -o /dev/null "$E2E_BASE_URL" && exit 0
            sleep 1
          done
          cat vite.log
          exit 1

      - name: Run the specs
        run: node e2e/run-all.mjs --jobs 3 ${{ matrix.specs }}

      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ matrix.browser }}
          path: |
            e2e-results/
            vite.log
          retention-days: 14
