# The browser specs in `e2e/`, against the Vite dev server, on every push and
# pull request.
#
#   chromium        every spec that needs only the dev server
#   webkit, firefox the core flows (open → annotate → export, redact, sign,
#                   lock). WebKit is the iPhone app's engine, so these are the
#                   flows that must work there; Firefox costs one more job.
#
# What is left out, and why, is SKIP (and SKIP_WHERE, per engine or OS) at the
# top of e2e/run-all.mjs —
# the Electron specs, the two that need a production or extension build, and
# the specs that are broken on main today. A spec that fails, then passes on
# its one retry, is reported as FLAKY and does not turn the run red.
#
# Playwright is not a dependency of the app (locally the specs borrow a
# sibling repo's copy), so it is installed here with --no-save at the version
# below. The jobs run in Playwright's own image for that version, which already
# holds all three browsers AND their system libraries: installing the
# libraries with `playwright install-deps` on a bare runner took 9 to 38
# minutes of apt per job (measured 2026-10-22), where pulling the image takes
# about one. The image is the browser cache. Keep its tag and
# PLAYWRIGHT_VERSION the same.
#
# Free: the repo is public, so ubuntu-latest minutes cost nothing.

name: e2e

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A newer push to a branch or PR cancels the older run, but not on main: main
# moves often (several sessions push to it), and every commit there should
# get its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  PLAYWRIGHT_VERSION: '1.62.1'
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  E2E_BASE_URL: 'http://localhost:5174/'
  # Relative to the checkout: inside a container `github.workspace` is the
  # host's path, not the one the job sees.
  E2E_RESULTS: e2e-results

jobs:
  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      # --ipc=host: Chromium runs out of shared memory in a container
      # without it. --user 1001: the runner's own user (Playwright's advice),
      # so the checkout is writable and Firefox is not started as root.
      options: --ipc=host --user 1001
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            specs: ''
          - browser: webkit
            specs: '--core'
          - browser: firefox
            specs: '--core'
    env:
      E2E_BROWSER: ${{ matrix.browser }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Playwright ${{ env.PLAYWRIGHT_VERSION }}
        run: npm install --no-save --no-audit --no-fund "playwright@$PLAYWRIGHT_VERSION"

      # The app refuses to start without a Supabase URL and key. Placeholders
      # in the right shape let it start; nothing in these specs signs in, and
      # the auth calls simply fail offline, as they would on a plane. No
      # secret is needed, and CI never talks to the real project.
      - name: Placeholder build configuration
        run: |
          printf '%s\n' \
            'VITE_PLATFORM_SUPABASE_URL=https://ci-placeholder.supabase.co' \
            'VITE_PLATFORM_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiI.eyJyb2xlIjoiYW5vbiJ9.c2lnbmF0dXJl' \
            > .env.local

      - name: Start the dev server
        run: |
          # --host: every address, IPv4 and IPv6, whichever "localhost" is.
          nohup npx vite --host --port 5174 --strictPort > vite.log 2>&1 &
          node -e '
            const until = Date.now() + 90000
            const poll = () => fetch(process.env.E2E_BASE_URL).then(
              (r) => (r.ok ? process.exit(0) : retry(`HTTP ${r.status}`)), (e) => retry(e.cause ?? e))
            const retry = (why) => {
              if (Date.now() > until) { console.error("dev server never answered:", why); process.exit(1) }
              setTimeout(poll, 1000)
            }
            poll()
          ' || { cat vite.log; exit 1; }

      - name: Run the specs
        run: node e2e/run-all.mjs --jobs 3 ${{ matrix.specs }}

      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ matrix.browser }}
          path: |
            e2e-results/
            vite.log
          retention-days: 14
