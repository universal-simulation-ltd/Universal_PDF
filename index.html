<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Universal PDF — free, open-source PDF viewer, annotator, signer and redactor that runs entirely in your browser. No uploads, no tracking, forever free." />
    <title>Universal PDF — open source, browser-based PDF editor</title>
    <link rel="canonical" href="https://opensource.unisim.co.uk/pdf/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Universal PDF" />
    <meta property="og:url" content="https://opensource.unisim.co.uk/pdf/" />
    <meta property="og:title" content="Universal PDF — open source, browser-based PDF editor" />
    <meta property="og:description" content="Free, open-source PDF viewer, annotator, signer and redactor that runs entirely in your browser. No uploads, no tracking, forever free." />
    <meta property="og:image" content="https://opensource.unisim.co.uk/pdf/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Universal PDF — open source, browser-based PDF editor" />
    <meta name="twitter:description" content="Free, open-source PDF viewer, annotator, signer and redactor that runs entirely in your browser. No uploads, no tracking, forever free." />
    <meta name="twitter:image" content="https://opensource.unisim.co.uk/pdf/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // If the JS bundle fails to load or throws before React mounts,
      // #root stays empty. After 8s show a fallback instead of a blank page.
      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && !root.firstChild) {
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;background:#f1f5f9">' +
            '<div style="background:#fff;border-radius:1rem;box-shadow:0 4px 24px #0001;padding:2.5rem;max-width:480px;width:100%;text-align:center">' +
            '<div style="font-size:2.5rem">⚠️</div>' +
            '<h2 style="margin:.75rem 0 .5rem;font-size:1.2rem;color:#0f172a">Failed to load</h2>' +
            '<p style="color:#64748b;font-size:.9rem;margin:0 0 1.5rem">Universal PDF could not start. This is likely a temporary issue.</p>' +
            '<button onclick="location.reload()" style="padding:.6rem 1.5rem;background:#ea580c;color:#fff;border:none;border-radius:.5rem;font-size:.9rem;font-weight:600;cursor:pointer">Reload page</button>' +
            '</div></div>';
        }
      }, 8000);
    </script>
  </body>
</html>
